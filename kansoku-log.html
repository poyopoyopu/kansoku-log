<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定点記録</title>
<style>
  :root{
    --bg:#0d0f0c; --fg:#c9d1c4; --dim:#5c6459; --accent:#9fb89a;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Courier New", monospace;
    margin:0; padding:24px 16px 80px;
    line-height:1.9; font-size:15px;
    max-width:640px; margin-inline:auto;
  }
  .ts{color:var(--dim); font-size:12px;}
  .entry{margin-bottom:36px; white-space:pre-wrap;}
  .entry.locked{color:var(--dim); filter:blur(2px); user-select:none;}
  .frag{color:var(--accent);}
  .promptline{display:flex; gap:8px; align-items:center; margin-top:8px;}
  input[type=text]{
    background:transparent; border:none; border-bottom:1px solid var(--dim);
    color:var(--fg); font-family:inherit; font-size:15px; padding:6px 2px;
    flex:1; outline:none;
  }
  input[type=text]:focus{border-bottom-color:var(--accent);}
  .hint{font-size:12px; color:var(--dim); margin-top:6px;}
  .cursor{display:inline-block; width:8px; background:var(--fg); animation:blink 1.1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .divider{color:var(--dim); text-align:center; margin:28px 0; letter-spacing:4px;}
  .final{color:var(--accent);}
  a.reset{color:var(--dim); font-size:11px;}
</style>
</head>
<body>

<div id="log"></div>

<script>
/* ===================================================================
   進行状態は localStorage のみで管理。サーバー・個人情報の送受信なし。
   このファイル単体で GitHub リポジトリにアップロードし、
   Cloudflare Pages でそのまま公開できる。
   =================================================================== */

const KEY = "kansoku_stage_v1";

function getStage(){
  return parseInt(localStorage.getItem(KEY) || "0", 10);
}
function setStage(n){
  localStorage.setItem(KEY, String(n));
}
function getAnswer(i){
  return localStorage.getItem(KEY+"_a"+i) || "";
}
function setAnswer(i,v){
  localStorage.setItem(KEY+"_a"+i, v);
}

// 各段の正解（すべて公開されている事実の数字。捏造した現地固有の暗号ではない）
const ANSWERS = {
  1: ["1853"],                // 台場築造着手年（嘉永6年）
  2: ["2022"],                // パレットタウン大観覧車 解体年
  3: ["10000","1万","一万"],   // 新設アリーナの収容人数（約1万人）
  4: ["2026"]                 // 東京ドリームパーク開業年
};

function render(){
  const stage = getStage();
  const log = document.getElementById("log");
  log.innerHTML = "";

  // ---- 冒頭（ゲームだと分からない体で始める） ----
  addEntry(`最終更新に失敗しました。
このページは自動生成された記録の残骸です。
更新は 2022年9月 で止まっています。

観測対象：不明
観測開始：不明
観測範囲：13号埋立地、北緯35.62 東経139.78 付近`, true, "record.log — corrupted");

  addEntry(`……ここまでは、誰でも読める。

もし続きを読みたいなら、
最初の数字をここに置いていくといい。
何かが、あなたの代わりに歩いてくれるはずだから。`, true);

  // ---- Stage 1 ----
  if (stage >= 0) {
    addStageBlock(1,
`最初の記録。

海だった場所に、幕府が何かを置いた年。
それが、この土地が「見る」役目を持たされた最初。

西暦を4桁で。`,
      "東京テレポート駅前からで良い。検索して構わない。"
    );
  }

  // ---- Stage 2 ----
  if (stage >= 1) {
    addEntryFrag(`[承認] 173年前の記録を受理。
目はまだ開いていない。ここからは、まだ"何か"の形をしていた頃の話。`);

    addStageBlock(2,
`次の記録。

かつてここに、大きな円形の観測装置があった。
直径100m。高さ115m。64個の目。

それが取り壊され、円が消えた年を。`,
      "パレットタウン跡地・青海側。旧観覧車があった場所の近くで。"
    );
  }

  // ---- Stage 3 ----
  if (stage >= 2) {
    addEntryFrag(`[承認] 円が消えた年を受理。
円が消えた場所には、何も残らなかったわけではない。
新しい箱が建った。今度は、何人分の目を持っている？`);

    addStageBlock(3,
`次の記録。

新しく建った建物が、一度に見ることのできる人数。
概数でいい。`,
      "TOYOTA ARENA TOKYO の正面あたりで。"
    );
  }

  // ---- Stage 4 ----
  if (stage >= 3) {
    addEntryFrag(`[承認] 一万、という数字を受理。
最後にもう一つだけ。少し離れた場所の話。`);

    addStageBlock(4,
`次の記録。

有明側、少し歩いた先にもう一つ新しい建物が生まれた。
それが生まれた年を。`,
      "東京ドリームパーク周辺。歩きすぎなくていい。"
    );
  }

  // ---- Final ----
  if (stage >= 4) {
    const a1853 = 1853;
    const a2026 = 2026;
    const span = a2026 - a1853;
    const wheelLife = 2022 - 1999;

    addEntryFrag(`[承認] すべての数字を受理。`);

    const finalEl = document.createElement("div");
    finalEl.className = "entry final";
    finalEl.innerHTML =
`計算します。

観覧車がこの土地を見ていた時間：
2022 − 1999 ＝ ${wheelLife}年

この土地そのものが、何かを見張るために作られてから今日まで：
${a2026} − ${a1853} ＝ ${span}年

観覧車は、たった${wheelLife}年しか見ていなかった。
見張る役目は、円が生まれるずっと前からここにあって、
円が消えたあとも、形を変えて続いている。

今、この街を静かに走っている低い車も、
たぶんその続きのひとつにすぎない。

――― 記録はここで途切れています。
　　　次に何が記録されるかは、まだ分かりません。`;
    log.appendChild(finalEl);

    const resetWrap = document.createElement("div");
    resetWrap.innerHTML = `<div class="divider">···</div><a class="reset" href="#" id="resetlink">記録を消して最初から見る</a>`;
    log.appendChild(resetWrap);
    document.getElementById("resetlink").onclick = (e)=>{
      e.preventDefault();
      for(let i=0;i<10;i++) localStorage.removeItem(KEY+"_a"+i);
      localStorage.removeItem(KEY);
      render();
      window.scrollTo(0,0);
    };
    return;
  }

  // 入力欄（未クリアの最新ステージ用）
  addInput(stage+1);
}

function addEntry(text, dim, tsLabel){
  const wrap = document.createElement("div");
  wrap.className = "entry";
  if (tsLabel) {
    const ts = document.createElement("div");
    ts.className = "ts";
    ts.textContent = tsLabel;
    wrap.appendChild(ts);
  }
  const body = document.createElement("div");
  body.textContent = text;
  if (dim) body.style.color = "var(--dim)";
  wrap.appendChild(body);
  document.getElementById("log").appendChild(wrap);
}

function addEntryFrag(text){
  const wrap = document.createElement("div");
  wrap.className = "entry frag";
  wrap.textContent = text;
  document.getElementById("log").appendChild(wrap);
}

function addStageBlock(n, text, hint){
  const wrap = document.createElement("div");
  wrap.className = "entry";
  wrap.textContent = text;
  document.getElementById("log").appendChild(wrap);

  if (getStage() >= n) {
    const done = document.createElement("div");
    done.className = "hint";
    done.textContent = "（この記録はすでに開いている）";
    document.getElementById("log").appendChild(done);
  }
}

function addInput(n){
  if (!ANSWERS[n]) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="promptline">
      <span>&gt;</span>
      <input type="text" id="ans" inputmode="numeric" autocomplete="off" placeholder="">
      <span class="cursor">&nbsp;</span>
    </div>
    <div class="hint" id="hintline"></div>
  `;
  document.getElementById("log").appendChild(wrap);

  const input = document.getElementById("ans");
  input.addEventListener("keydown", (e)=>{
    if (e.key === "Enter") {
      const v = input.value.trim();
      const ok = ANSWERS[n].some(a => a === v);
      if (ok) {
        setStage(n);
        render();
        window.scrollTo(0, document.body.scrollHeight);
      } else {
        document.getElementById("hintline").textContent = "……まだ違う。";
      }
    }
  });
}

render();
</script>
</body>
</html>
